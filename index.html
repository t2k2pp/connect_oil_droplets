    while (beads.length < beadTarget()) spawnBead(false);
  },
  dropSound(delay, pan) { this.after(delay + .02, () => { ripple(pan * 500, 0, .25); Snd.drip(pan); }); },
  pickNext() { return this.colorsLeft.length ? this.colorsLeft[rand(this.colorsLeft.length) | 0] : -1; },

  /* ---- 塊の変化を受ける ---- */
  onTrack(merges, tears) {
    if (this.state === 'title') {
      this.meter = 0;
      return;
    }
    const live = colorStat.reduce((a, s) => a + s.n, 0);
    this.meter = live / capOf();
    if (this.state !== 'play') return;
    this.peak = Math.max(this.peak, this.meter);
    for (const m of merges) this.onMerge(m);
    for (const c of tears) if (!this.bonus) { const x = c.sx / c.n; Snd.tear(x / DISH); ripple(x, c.sy / c.n, .35); }

    if (this.bonus) {
      this.pieces = blobList.length;
      return;
    }
    for (let i = this.colorsLeft.length - 1; i >= 0; i--) {
      const col = this.colorsLeft[i], s = colorStat[col];
      if (s.n === 0 && !s.pending) { this.colorsLeft.splice(i, 1); continue; }
      if (s.big === 1 && !s.pending && (!this.dripSpot || this.next !== col)) {
        this.popHold[col] += 1 / 15;
        this.flash[col] = Math.max(this.flash[col], this.popHold[col] * 1.1);
        if (this.popHold[col] >= .36) { this.popColor(col); this.colorsLeft.splice(i, 1); }
      } else this.popHold[col] = 0;
    }
    if (!this.colorsLeft.length && this.state === 'play') this.levelDone();
    else if (this.next >= 0 && !this.colorsLeft.includes(this.next)) { this.next = this.pickNext(); this.syncNext(); }
  },

  onMerge(m) {
    const c = m.c, x = c.cx !== null ? c.cx : c.sx / c.n, y = c.cy !== null ? c.cy : c.sy / c.n, pan = x / DISH;
    const col = c.col;
    const ra = linRoot(m.a), rb = linRoot(m.b);
    if (ra === rb) { Snd.merge(pan, false, 0); ripple(x, y, .4); return; }
    lineage.set(rb, ra);
    if (sim.boost <= 0) this.bumpCombo();
    save.merges++; this.mergedThisLevel++;
    const pts = (60 + Math.min(m.minor, 60) * 3) * (sim.boost > 0 ? .5 : this.mult()) * this.levelMult();
    this.addScore(pts, x, y, col, this.combo >= 2 ? `×${this.mult().toFixed(2).replace(/0$/, '')}` : '');
    Snd.merge(pan, true, this.combo);
    ripple(x, y, 1);
    burst(x, y, col, 18 + Math.min(m.minor, 24), 7);
    this.flash[col] = Math.max(this.flash[col], .55);
    shock(x, y, 240, 1.6);
    vibrate(10);
  },
  bumpCombo() {
    this.combo = this.comboT > 0 ? this.combo + 1 : 1;
    this.comboT = 5;
    if (this.combo > save.bestCombo) save.bestCombo = this.combo;
  },
  mult() { return Math.min(3, 1 + (this.combo - 1) * .25); },
  levelMult() { return 1 + (this.level - 1) * .06; },

  popColor(col) {
    let sx = 0, sy = 0, n = 0;
    for (let i = 0; i < P.n; i++) if (P.col[i] === col && !P.dying[i]) { sx += P.x[i]; sy += P.y[i]; n++; }
    if (!n) return;
    const cx = sx / n, cy = sy / n, R0 = Math.sqrt(n * AREA / Math.PI);
    for (let i = 0; i < P.n; i++) {
      if (P.col[i] !== col || P.dying[i]) continue;
      if (P.grab[i]) P.grab[i] = 0;
      P.dying[i] = 1;
      const dx = P.x[i] - cx, dy = P.y[i] - cy, d = Math.hypot(dx, dy) || 1, s = rand(4, 11) * (.5 + d / (R0 + 1));
      P.vx[i] = dx / d * s + rand(-1, 1); P.vy[i] = dy / d * s + rand(-1, 1);
    }
    pairsOK = false;
    if (ptr.grabbing) { let any = false; for (let i = 0; i < P.n; i++) if (P.grab[i]) { any = true; break; } if (!any) releaseGrab(false); }
    this.chain = this.chainT > 0 ? this.chain + 1 : 0;
    this.chainT = 7;
    if (sim.boost <= 0) this.bumpCombo();
    save.vanish++; this.vanishedThisLevel++;
    const pts = (420 + Math.min(n, 300) * 7) * (sim.boost > 0 ? .5 : this.mult()) * this.levelMult() * (1 + this.chain * .35);
    this.addScore(pts, cx, cy, col, this.chain ? `つづけて ${this.chain + 1}色！` : '', true);
    Snd.vanish(cx / DISH, this.chain);
    ripple(cx, cy, 2.2);
    burst(cx, cy, col, 90, 16, 1.5);
    this.flash[col] = 1;
    shock(cx, cy, R0 + 560, 11);
    vibrate(35);
    if (this.level >= 1 && this.chain >= 1) burst(cx, cy, -1, 30, 22, 1.1);
  },

  onBead(d) {
    burst(d.x, d.y, d.c, 4, 3.4, .55);
    this.score += 4; this.touchBest();
    Snd.bead(d.x / DISH);
  },

  addScore(v, x, y, col, extra, big) {
    v = Math.round(v / 5) * 5;
    this.score += v;
    this.touchBest();
    floatText(`+${fmt(v)}${extra ? ' ' + extra : ''}`, x, y, col, big);
  },
  touchBest() {
    if (this.score > ms().best) {
      ms().best = this.score;
      if (!this.newBest) { this.newBest = true; $('best').classList.add('new'); }
    }
  },

  /* ---- ひと息 ---- */
  breath(auto) {
    if (this.state !== 'play' || this.bonus) return;
    if (save.charges <= 0) { Snd.ui(); return; }
    save.charges--;
    this.dripPause = 16; sim.boost = 1;
    this.after(5, () => { sim.boost = 0; });
    Snd.breath();
    ripple(0, 0, 2.2);
    this.overT = 0; this.warned = false;
    showToast(auto ? 'ふう… ひと息' : 'ひと息', `<p>しずくが止まって、同じ色が引き合います</p>`, 1800);
    this.syncCharges();
    persist();
  },

  /* ---- ボーナス ---- */
  cutAt(x, y) {
    if (!this.bonus || this.state !== 'play') return;
    const s = this.stroke || (this.stroke = { blob: -1, ex: 0, ey: 0, lx: x, ly: y });
    const steps = Math.max(1, Math.hypot(x - s.lx, y - s.ly) / 18 | 0);
    for (let k = 1; k <= steps; k++) {
      const px = lerp(s.lx, x, k / steps), py = lerp(s.ly, y, k / steps);
      const b = blobAt(px, py, 34);
      if (s.blob < 0 && b >= 0) { s.blob = b; s.ex = px; s.ey = py; }
      else if (s.blob >= 0 && b !== s.blob) {
        this.cutBlob(s.blob, s.ex, s.ey, px, py);
        s.blob = b; s.ex = px; s.ey = py;
      }
    }
    s.lx = x; s.ly = y;
  },
  endStroke() {
    const s = this.stroke;
    if (s && s.blob >= 0 && Math.hypot(s.lx - s.ex, s.ly - s.ey) > 70) this.cutBlob(s.blob, s.ex, s.ey, s.lx, s.ly);
    this.stroke = null;
  },
  cutBlob(id, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy);
    if (l < 24) return;
    const nx = -dy / l, ny = dx / l;
    const side = [[], []];
    for (let i = 0; i < P.n; i++) {
      if (P.blob[i] !== id || P.dying[i]) continue;
      side[(P.x[i] - ax) * nx + (P.y[i] - ay) * ny > 0 ? 1 : 0].push(i);
    }
    if (side[0].length < MIN_BLOB || side[1].length < MIN_BLOB) return;
    const nid = nextBlob++;
    const minor = side[0].length < side[1].length ? 0 : 1;
    for (const i of side[minor]) P.blob[i] = nid;
    for (const i of side[0]) { P.vx[i] -= nx * 3; P.vy[i] -= ny * 3; }
    for (const i of side[1]) { P.vx[i] += nx * 3; P.vy[i] += ny * 3; }
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    ripple(mx, my, .6);
    Snd.cut(mx / DISH);
    burst(mx, my, P.col[side[0][0]], 7, 6, .7);
    vibrate(6);
    this.pieces++;
  },
  bonusEnd() {
    this.state = 'clearing';
    releaseGrab(false);
    const hit = this.pieces >= this.bonusTarget;
    const list = blobList.slice().sort((a, b) => Math.atan2(a.sy / a.n, a.sx / a.n) - Math.atan2(b.sy / b.n, b.sx / b.n));
    const each = (hit ? 90 : 55) * this.levelMult();
    let total = 0;
    list.forEach((c, i) => {
      this.after(.08 * i, () => {
        const x = c.sx / c.n, y = c.sy / c.n;
        for (let k = 0; k < P.n; k++) {
          if (P.blob[k] !== c.id || P.dying[k]) continue;
          P.dying[k] = 1;
          const a = rand(TAU), s = rand(2, 6);
          P.vx[k] = Math.cos(a) * s; P.vy[k] = Math.sin(a) * s;
        }
        pairsOK = false;
        burst(x, y, c.col, 12, 8, .9);
        ripple(x, y, .7);
        Snd.bonusPop(i, x / DISH);
        vibrate(5);
        const v = Math.round(each * (1 + i * .03) / 5) * 5;
        total += v;
        this.score += v; this.touchBest();
        if (i % 3 === 0 || list.length < 12) floatText(`+${fmt(v)}`, x, y, c.col);
      });
    });
    this.after(.08 * list.length + .1, () => {
      for (let k = 0; k < P.n; k++) if (!P.dying[k]) P.dying[k] = 2;
      pairsOK = false;
    });
    this.after(.08 * list.length + .5, () => {
      Snd.clear();
      this.finishLevel([`わけた数 ${list.length} / 目標 ${this.bonusTarget}`, hit ? '目標達成！ ×1.6' : 'のんびりでも大丈夫'], total);
    });
  },

  /* ---- 終わり方 ---- */
  levelDone() {
    this.state = 'clearing';
    releaseGrab(false);
    const clearBonus = Math.round((180 + this.level * 70) / 5) * 5;
    const calm = Math.round(clamp(1 - this.peak, 0, 1) * 500 * this.levelMult() / 5) * 5;
    this.score += clearBonus + calm; this.touchBest();
    this.after(.7, () => {
      Snd.clear();
      burst(0, 0, -1, 70, 20, 1.3);
      ripple(0, 0, 2);
      this.finishLevel([`クリアボーナス +${fmt(clearBonus)}`, `おだやかボーナス +${fmt(calm)}`, `つなげた数 ${this.mergedThisLevel}　時間 ${fmtTime(this.levelTime)}`], clearBonus + calm);
    });
  },
  finishLevel(lines, sum) {
    const L = this.level, nextL = L + 1;
    save.clears++;
    ms().maxLevel = Math.max(ms().maxLevel, nextL);
    ms().checkpoints[nextL] = this.score;
    ms().level = nextL; ms().score = this.score;
    if (save.charges < 3) save.charges++;
    persist();
    clearBoard();
    this.syncCharges();
    const changed = themeOf(nextL) !== themeOf(L);
    const nextLook = isRamen() ? `つぎのスープ: ${lookOf(nextL).name}` : `つぎの水面: ${lookOf(nextL).name}`;
    showToast(`LEVEL ${L} クリア`, lines.map(s => `<p>${s}</p>`).join('') + `<p class="sum">+${fmt(sum)}</p>` + (changed ? `<p>${nextLook}</p>` : ''), 2600);
    this.after(2.9, () => { this.newBest = false; $('best').classList.remove('new'); this.start(nextL, true); });
  },
  gameOver() {
    this.state = 'over';
    releaseGrab(false);
    Snd.over();
    persist();
    clearBoard();
    $('overStats').innerHTML = `<div><b>${fmt(this.score)}</b>SCORE</div><div><b>${this.level}</b>LEVEL</div><div><b>${fmt(ms().best)}</b>BEST</div>`;
    $('btnRetry').textContent = `LEVEL ${this.level} からもう一度`;
    $('overTtl').textContent = isRamen() ? '油があふれました' : '水があふれました';
    showOverlay('ovOver');
  },

  /* ---- 毎フレーム ---- */
  update(dt) {
    for (let i = 0; i < COLORS.length; i++) this.flash[i] *= Math.pow(.02, dt);
    updateTheme(dt);
    if (this.state !== 'play' && this.state !== 'clearing' && this.state !== 'intro') return;
    this.t += dt;
    if (this.q.length) {
      const due = this.q.filter(q => q.at <= this.t);
      if (due.length) { this.q = this.q.filter(q => q.at > this.t); due.forEach(q => q.fn()); }
    }
    if (this.state !== 'play' && this.state !== 'clearing') return;
    save.playSec += dt;
    if (this.state !== 'play') return;
    this.levelTime += dt;
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) { this.combo = 0; Snd.step = 0; } }
    if (this.chainT > 0) this.chainT -= dt;
    if (this.bonus) {
      this.bonusTime -= dt;
      if (this.bonusTime <= 0) { this.bonusTime = 0; this.bonusEnd(); }
    } else this.updateDrip(dt);
    this.beat += dt;
    if (this.beat > 3) { this.beat = 0; this.saveBoard(); }
  },
  updateDrip(dt) {
    // 水位がしきい値を超えた
    if (this.meter >= 1) {
      if (this.dripPause > 0) { this.dripPause -= dt; return; }
      if (save.charges > 0) { this.breath(true); return; }
      this.overT += dt;
      if (!this.warned) { this.warned = true; Snd.warn(); }
      if (this.overT > OVER_GRACE) this.gameOver();
      return;
    }
    this.overT = Math.max(0, this.overT - dt * 2);
    if (this.meter < .92) this.warned = false;
    if (this.dripPause > 0) { this.dripPause -= dt; return; }
    if (!this.dripEvery || this.next < 0) return;
    // 水位が高いほど、しずくはゆっくりになる
    const slow = 1 + clamp((this.meter - .55) / .45, 0, 1) * 1.4;
    this.dripIn -= dt / slow;
    if (this.dripIn < .7 && !this.dripSpot) { this.dripSpot = findOpenSpot(); ripple(this.dripSpot[0], this.dripSpot[1], .25); }
    if (this.dripIn <= 0) {
      const [x, y] = this.dripSpot || findOpenSpot();
      this.dripSpot = null;
      const col = this.colorsLeft.includes(this.next) ? this.next : this.pickNext();
      if (col >= 0) {
        spawnBlob(x, y, this.dripSize, col, 0, false);
        ripple(x, y, 1);
        Snd.drip(x / DISH);
        burst(x, y, col, 6, 5, .7);
        shock(x, y, 170, 1.2);
      }
      this.dripIn = this.dripEvery;
      this.next = this.pickNext();
      this.syncNext();
    }
  },

  /* ---- HUD ---- */
  syncAll() {
    $('vLevel').textContent = this.level;
    this.syncNext(); this.syncCharges();
    const showHints = this.level <= 2 && !this.bonus;
    $('hints').classList.toggle('gone', !showHints);
    $('statusStar').style.display = this.bonus ? '' : 'none';
    const ramen = isRamen();
    $('statusTtl').textContent = this.bonus ? 'BONUS' : ramen ? '油の量' : '水位';
    $('statusMsg').textContent = this.bonus ? (ramen ? '大きな油を細かく分けよう！' : '大きな色を細かく分けよう！') : ramen ? 'あふれる前に、ひとつに' : '色を消すと下がるよ';
    $('goalText').innerHTML = this.bonus ? 'すばやくなぞって<br>切り分けよう！' : ramen ? '油をぜんぶつなげて<br>ひとつにしよう！' : '同じ色をすべてつなげて<br>消そう！';
    resize();
  },
  syncNext() {
    const el = $('vNext');
    el.classList.toggle('none', this.next < 0);
    el.classList.toggle('naruto', isRamen());
    if (this.next >= 0 && !isRamen()) el.style.setProperty('--c', cssColor(this.next));
  },
  syncCharges() {
    const dots = document.querySelectorAll('#breath .dots i');
    dots.forEach((d, i) => d.classList.toggle('on', i < save.charges));
    $('breath').classList.toggle('empty', save.charges <= 0 || this.bonus);
  },
  syncHud(dt) {
    this.shownScore = lerp(this.shownScore, this.score, 1 - Math.pow(.0005, dt));
    if (Math.abs(this.shownScore - this.score) < 2) this.shownScore = this.score;
    $('vScore').textContent = fmt(this.shownScore);
    $('vBest').textContent = fmt(ms().best);
    $('vTime').textContent = fmtTime(this.bonus ? this.bonusTime : this.levelTime);
    if (this.next >= 0 && this.dripEvery) $('vNext').style.setProperty('--p', (1 - clamp(this.dripIn / this.dripEvery, 0, 1)).toFixed(3));
    const st = $('status');
    if (this.bonus) {
      $('statusBar').style.width = clamp(this.pieces / this.bonusTarget, 0, 1) * 100 + '%';
      $('statusVal').textContent = `${this.pieces} / ${this.bonusTarget}`;
      st.classList.remove('warn');
    } else {
      $('statusBar').style.width = clamp(this.meter, 0, 1) * 100 + '%';
      const left = this.meter >= 1 && save.charges <= 0 ? ` あと${Math.ceil(OVER_GRACE - this.overT)}秒` : '';
      $('statusVal').textContent = Math.round(this.meter * 100) + '%' + left;
      st.classList.toggle('warn', this.meter >= .85);
    }
  },

  /* ---- 盤面の保存 ---- */
  saveBoard() {
    if (this.state !== 'play' && this.state !== 'paused') return;
    const d = [];
    for (let i = 0; i < P.n; i++) {
      if (P.dying[i]) continue;
      d.push(Math.round(P.x[i]), Math.round(P.y[i]), P.col[i], P.blob[i]);
    }
    ms().score = this.score; ms().level = this.level;
    persist();
    writeJSON(boardKey(), {
      level: this.level, d, nextBlob, t: Math.round(this.levelTime), left: this.colorsLeft, lin: [...lineage.keys()].map(id => [id, linRoot(id)]),
      next: this.next, dripIn: this.dripIn, peak: this.peak, bonusTime: this.bonusTime, pieces: this.pieces,
      startScore: this.startScore, combo: 0,
    });
  },
  resume() {
    const b = readJSON(boardKey());
    if (!b.d || b.level !== ms().level || !b.d.length) { this.start(ms().level, false); return; }
    this.score = this.shownScore = ms().score; this.level = b.level; this.startScore = b.startScore || ms().score;
    this.setup(b.level);          // 構成値を入れ直してから盤面を置き換える
    clearParticles();
    this.q = [];
    for (let k = 0; k < b.d.length; k += 4) addParticle(b.d[k], b.d[k + 1], b.d[k + 2], b.d[k + 3], 1);
    nextBlob = Math.max(b.nextBlob || 1, nextBlob);
    this.levelTime = b.t || 0;
    if (b.lin) for (const [id, r] of b.lin) lineage.set(id, r);
    this.peak = b.peak || 0;
    if (this.bonus) { this.bonusTime = b.bonusTime > 0 ? b.bonusTime : this.bonusTotal; this.pieces = b.pieces || 0; }
    else { this.colorsLeft = b.left || this.colorsLeft; this.next = b.next ?? this.next; this.dripIn = b.dripIn ?? this.dripIn; }
    this.state = 'play';
    this.syncAll();
    showOverlay(null);
    $('ui').classList.remove('off');
  },
};

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function vibrate(ms) {
  try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(ms); } catch (e) {}
}
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return `${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }

function findOpenSpot() {
  let best = [0, 0], bs = -1;
  for (let k = 0; k < 14; k++) {
    const a = rand(TAU), r = Math.sqrt(Math.random()) * (INNER - 90);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    let m = 1e12;
    for (let i = 0; i < P.n; i += 3) {
      if (P.dying[i]) continue;
      const dx = P.x[i] - x, dy = P.y[i] - y, d = dx * dx + dy * dy;
      if (d < m) m = d;
    }
    if (m > bs) { bs = m; best = [x, y]; }
  }
  return best;
}

function blobAt(x, y, rad) {
  if (!pairsOK) return -1;
  const cx = cellOf(x), cy = cellOf(y), r2 = rad * rad;
  let best = -1, bd = r2;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    const gx = cx + ox, gy = cy + oy;
    if (gx < 0 || gy < 0 || gx >= GN || gy >= GN) continue;
    for (let i = gridHead[gx + gy * GN]; i >= 0; i = gridNext[i]) {
      if (i >= P.n || P.dying[i]) continue;
      const dx = P.x[i] - x, dy = P.y[i] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = P.blob[i]; }
    }
  }
  return best;
}

/* ---- 粒子の寿命 ---- */
function reap(dt) {
  for (let i = P.n - 1; i >= 0; i--) {
    if (P.dying[i]) {
      P.w[i] -= dt * (P.dying[i] === 2 ? 4 : 1.55);
      if (P.w[i] <= 0) removeParticle(i);
    } else if (P.w[i] < 1) {
      P.w[i] = Math.min(1, P.w[i] + dt * 2.6);
    }
  }
}

/* ---- テーマの移ろい ---- */
function updateTheme(dt) {
  const T = lookOf(Game.level), k = 1 - Math.pow(.25, dt);
  for (const key of ['a', 'b', 'out', 'glint', 'rim', 'oil']) for (let i = 0; i < 3; i++) theme[key][i] = lerp(theme[key][i], T[key][i], k);
}

/* ---------- 入力 ---------- */
function grabAt(wx, wy) {
  let best = -1, bd = 120 * 120;
  for (let i = 0; i < P.n; i++) {
    if (P.dying[i] || P.w[i] <= 0) continue;
    const dx = P.x[i] - wx, dy = P.y[i] - wy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best < 0) return false;
  const id = P.blob[best], R2 = 92 * 92;
  const cand = [];
  for (let i = 0; i < P.n; i++) {
    if (P.blob[i] !== id || P.dying[i]) continue;
    const dx = P.x[i] - P.x[best], dy = P.y[i] - P.y[best], d = dx * dx + dy * dy;
    if (d < R2) cand.push([d, i]);
  }
  cand.sort((a, b) => a[0] - b[0]);
  let total = 0;
  for (let i = 0; i < P.n; i++) if (P.blob[i] === id && !P.dying[i]) total++;
  cand.slice(0, clamp(Math.round(total * .17), 5, 20)).forEach(([, i]) => {
    P.grab[i] = 1;
    P.gx[i] = (P.x[i] - P.x[best]) * .62;
    P.gy[i] = (P.y[i] - P.y[best]) * .62;
  });
  ptr.x = P.x[best]; ptr.y = P.y[best];
  for (let i = 0; i < P.n; i++) P.fam[i] = P.blob[i] === id && !P.dying[i] ? 1 : 0;
  ptr.grabbing = true; ptr.tethered = true; ptr.over = false; ptr.blob = id; ptr.tau = tau[P.col[best]];
  canvas.classList.add('grabbing');
  return true;
}
function releaseGrab(withSound = true) {
  if (ptr.grabbing && withSound) {
    if (ptr.stretch > .25) { Snd.release(ptr.x / DISH, ptr.stretch); ripple(ptr.x, ptr.y, .5); }
  }
  for (let i = 0; i < P.n; i++) { P.grab[i] = 0; P.fam[i] = 0; }
  ptr.grabbing = false; ptr.tethered = false; ptr.over = false; ptr.blob = -1;
  canvas.classList.remove('grabbing');
  Snd.setStretch(0, 0);
}
canvas.addEventListener('pointerdown', e => {
  Snd.init();
  if (ptr.down || !Game.playing()) return;
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  ptr.id = e.pointerId; ptr.down = true; ptr.rawX = ptr.x = wx; ptr.rawY = ptr.y = wy; ptr.moved = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  ripple(wx, wy, .35);
  if (Game.bonus) { Game.stroke = { blob: -1, ex: wx, ey: wy, lx: wx, ly: wy }; return; }
  if (grabAt(wx, wy)) Snd.grab(wx / DISH);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== ptr.id || !ptr.down) return;
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const d = Math.hypot(wx, wy), lim = INNER - 20;
  ptr.rawX = d > lim ? wx * lim / d : wx; ptr.rawY = d > lim ? wy * lim / d : wy;
  if (Game.bonus) { ptr.x = ptr.rawX; ptr.y = ptr.rawY; Game.cutAt(ptr.rawX, ptr.rawY); }
});
const pointerEnd = e => {
  if (e.pointerId !== ptr.id) return;
  ptr.down = false; ptr.id = null;
  if (Game.bonus) Game.endStroke();
  releaseGrab(Game.playing());
};
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (Game.state === 'play') pause(); else if (Game.state === 'paused') unpause(); }
  else if (e.code === 'Space') { e.preventDefault(); Game.breath(false); }
});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (Game.state === 'play') pause();
    Game.saveBoard(); persist();
    Snd.suspend();
  } else Snd.resume();
});
window.addEventListener('pagehide', () => { Game.saveBoard(); persist(); });

/* ---------- UI ---------- */
function showOverlay(id) {
  document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('on', o.id === id));
}
function floatText(text, x, y, col, big) {
  const [cx, cy] = toCss(x, y);
  const el = document.createElement('div');
  el.className = 'float' + (big ? ' big' : '');
  el.textContent = text;
  el.style.left = clamp(cx, 60, window.innerWidth - 60) + 'px';
  el.style.top = clamp(cy, 50, window.innerHeight - 40) + 'px';
  if (col >= 0) el.style.textShadow = `0 1px 3px rgba(20,50,90,.7),0 0 12px ${cssColor(col)}`;
  el.addEventListener('animationend', () => el.remove());
  document.body.appendChild(el);
}
let toastTimer = 0;
function showToast(title, html, ms) {
  $('toastTtl').textContent = title; $('toastBody').innerHTML = html;
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('on'), ms);
}
function statsHtml() {
  return `<div><b>${fmt(ms().best)}</b>BEST</div><div><b>${fmt(save.vanish)}</b>消した色</div><div><b>${fmt(save.merges)}</b>つなげた数</div><div><b>${save.playSec / 60 | 0}分</b>水面の時間</div>`;
}
function refreshTitle() {
  const has = ms().played;
  $('btnContinue').style.display = has ? '' : 'none';
  $('btnContinue').textContent = `つづきから（LEVEL ${ms().level}）`;
  $('btnNew').classList.toggle('main', !has);
  $('btnNew').textContent = has ? 'LEVEL 1 からはじめる' : 'はじめる';
  $('btnPick').style.display = ms().maxLevel > 1 ? '' : 'none';
  $('titleStats').innerHTML = has ? statsHtml() : '';
  const ramen = isRamen();
  $('tabColor').classList.toggle('on', !ramen);
  $('tabRamen').classList.toggle('on', ramen);
  $('modeDesc').innerHTML = ramen ? 'スープに浮かぶ油を、ひとつにまとめる。<br>醤油、塩、味噌、豚骨とスープが変わります。' : 'カラフルなしずくを、色ごとにつなげて消す。<br>同じ色がすべてつながると、はじけます。';
  syncTension();
}
function setMode(m) {
  if (save.mode === m) return;
  save.mode = m;
  document.body.classList.toggle('ramen', m === 'ramen');
  beads.length = 0;
  Game.level = ms().level;
  applyTension();
  persist();
  resize();
  refreshTitle();
  demoBoard();
}
const TENSION_NOTE = {
  fixed: '弱いほど細くのびて切れやすく、強いほど丸くまとまって切れにくくなります。',
  color: '色ごとに張力が変わります。黄色と桃色は切れやすく、紫と青緑はもっちりしています。',
  soup: 'スープごとに変わります。塩は切れやすく、味噌と豚骨はもっちりしています。',
};
function mountTension(box) {
  box.innerHTML = `<span class="ttl">界面張力（表面張力）</span>
    <div class="chips">
      <button class="chip" data-v="15">よわい</button><button class="chip" data-v="50">ふつう</button>
      <button class="chip" data-v="85">つよい</button><button class="chip" data-v="by"></button>
    </div>
    <input type="range" min="0" max="100" aria-label="界面張力">
    <span class="note"></span>`;
  box.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    Snd.init(); Snd.ui();
    if (c.dataset.v === 'by') save.tensionMode = 'byColor';
    else { save.tensionMode = 'fixed'; save.tension = +c.dataset.v; }
    tensionChanged();
  }));
  box.querySelector('input').addEventListener('input', e => {
    save.tensionMode = 'fixed'; save.tension = +e.target.value;
    tensionChanged();
  });
}
function tensionChanged() { applyTension(); persist(); syncTension(); }
function syncTension() {
  const by = save.tensionMode === 'byColor';
  document.querySelectorAll('.tensionBox').forEach(box => {
    box.querySelectorAll('.chip').forEach(c => {
      if (c.dataset.v === 'by') c.textContent = isRamen() ? 'スープごと' : '色ごと';
      c.classList.toggle('on', c.dataset.v === 'by' ? by : !by && +c.dataset.v === save.tension);
    });
    const r = box.querySelector('input');
    r.value = save.tension; r.style.display = by ? 'none' : '';
    box.querySelector('.note').textContent = !by ? TENSION_NOTE.fixed : isRamen() ? TENSION_NOTE.soup : TENSION_NOTE.color;
  });
}
function pause() {
  if (Game.state !== 'play') return;
  Game.state = 'paused';
  pointerEndAll();
  $('pauseStats').innerHTML = statsHtml();
  syncTension();
  showOverlay('ovPause');
  Game.saveBoard();
  persist();
}
function unpause() {
  if (Game.state !== 'paused') return;
  Game.state = 'play';
  showOverlay(null);
}
function pointerEndAll() { ptr.down = false; ptr.id = null; releaseGrab(false); }

let levelsBack = 'ovTitle';
function openLevels(from) {
  levelsBack = from;
  const grid = $('levelGrid');
  grid.innerHTML = '';
  for (let L = 1; L <= ms().maxLevel; L++) {
    const b = document.createElement('button');
    b.textContent = L;
    if (L % 5 === 0) b.classList.add('bonus');
    if (L === ms().maxLevel) b.classList.add('cur');
    b.addEventListener('click', () => { Snd.init(); Snd.ui(); clearBoard(); Game.start(L, false); });
    grid.appendChild(b);
  }
  showOverlay('ovLevels');
  grid.scrollTop = grid.scrollHeight;
}
function toTitle() {
  Game.saveBoard();
  persist();
  Game.state = 'title';
  $('ui').classList.add('off');
  refreshTitle();
  showOverlay('ovTitle');
  demoBoard();
}
function demoBoard() {
  clearParticles();
  sim.split = false; sim.boost = 0;
  Game.level = ms().level;
  Game.meter = 0;
  const ramen = isRamen();
  const cols = ramen ? [0] : shuffle(COLORS.map((_, i) => i));
  const spots = ramen ? 12 : 7;
  for (let i = 0; i < spots; i++) {
    const a = i * TAU / spots + rand(-.2, .2), r = rand(380, ramen ? 800 : 640);
    spawnBlob(Math.cos(a) * r, Math.sin(a) * r, ramen ? rand(9, 30) | 0 : rand(30, 90) | 0, cols[i % cols.length], i * .1, !ramen);
  }
  while (beads.length < beadTarget()) spawnBead(false);
}

const uiClick = (id, fn) => $(id).addEventListener('click', () => { Snd.init(); Snd.ui(); fn(); });
document.querySelectorAll('.tensionBox').forEach(mountTension);
uiClick('tabColor', () => setMode('color'));
uiClick('tabRamen', () => setMode('ramen'));
$('ovBonus').addEventListener('click', () => { Snd.init(); Game.beginBonus(); });
uiClick('btnContinue', () => Game.resume());
uiClick('btnNew', () => { clearBoard(); ms().checkpoints[1] = 0; Game.newBest = false; $('best').classList.remove('new'); Game.start(1, false); });
uiClick('btnPick', () => openLevels('ovTitle'));
uiClick('btnPick2', () => openLevels('ovPause'));
uiClick('btnPick3', () => openLevels('ovOver'));
uiClick('btnLevelsBack', () => showOverlay(levelsBack));
uiClick('btnPause', pause);
uiClick('btnResume', unpause);
uiClick('btnRestart', () => { clearBoard(); Game.start(Game.level, false); });
uiClick('btnToTitle', toTitle);
uiClick('btnRetry', () => Game.start(Game.level, false));
$('breath').addEventListener('click', () => { Snd.init(); Game.breath(false); });
$('rngSe').value = save.se; $('rngAmb').value = save.amb;
$('rngSe').addEventListener('input', e => { save.se = +e.target.value; Snd.applyVolumes(); persist(); });
$('rngSe').addEventListener('change', () => Snd.plop(480, 1100, .1, .22));
$('rngAmb').addEventListener('input', e => { save.amb = +e.target.value; Snd.applyVolumes(); persist(); });

/* ---------- ループ ---------- */
let lastT = performance.now(), acc = 0, trackAcc = 0, frameAvg = 16, frameN = 0, stretchT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = now - lastT; lastT = now;
  const dt = Math.min(raw / 1000, .05);
  if (Game.state !== 'paused') {
    acc += dt * RATE;
    let steps = acc | 0;
    acc -= steps;
    if (steps > 6) steps = 6;
    for (let i = 0; i < steps; i++) simStep();
    trackAcc += dt;
    if (trackAcc >= 1 / 15 && steps > 0) { trackAcc = 0; track(); }
    updateBeads(dt);
    updateSparks(dt);
    for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > 2.4) ripples.splice(i, 1); }
    reap(dt);
    // のばしている間の水音
    stretchT += dt;
    if (stretchT > .05) { stretchT = 0; if (ptr.grabbing) Snd.setStretch(ptr.speed, ptr.stretch); }
  }
  Game.update(dt);
  if (Game.state !== 'title') Game.syncHud(dt);
  render(now / 1000);
  // 重い端末では解像度を自動で下げる
  frameAvg = lerp(frameAvg, raw, .05);
  if (++frameN > 90) {
    frameN = 0;
    if (frameAvg > 26 && view.res > .55 && !document.hidden) { view.res = Math.max(.55, view.res * .85); resize(); }
  }
}

function boot() {
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => initGL());
  let ok = false;
  try { ok = initGL(); } catch (e) { console.error(e); }
  if (!ok) { $('noGL').style.display = 'block'; }
  document.body.classList.toggle('ramen', isRamen());
  Game.level = ms().level;
  applyTension();
  resize();
  refreshTitle();
  demoBoard();
  // テーマは現在のレベルから始める
  const T = lookOf(ms().level);
  for (const k of ['a', 'b', 'out', 'glint', 'rim', 'oil']) theme[k] = [...T[k]];
  Snd.root = [196, 220, 174.61, 164.81][themeOf(ms().level)];
  if (ok) requestAnimationFrame(frame);
}
boot();
// 動作確認用
window.__oilmerge = { Game, P, ptr, save, sim, tau, linkOf, ms, setMode, beads, PHYS, Snd, colorStat, simStep, track, reap, toCss, view, get blobList() { return blobList; }, get np() { return np; } };
</script>
