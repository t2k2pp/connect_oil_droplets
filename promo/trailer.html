<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Droplet Merge trailer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=DotGothic16&family=Fredoka:wght@500;600&display=block">
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
'use strict';
/* =========================================================
   しずくあわせ 紹介動画
   実際のゲームをiframeで動かしてコマ送りし、ドット絵の場面と合成する。
   render.mjs から trailer.init() / trailer.frame(i) / trailer.audio() を呼ぶ。
   ========================================================= */
const W = 1920, H = 1080, FPS = 30, DUR = 30, PX = 8;
const out = document.getElementById('out'), c = out.getContext('2d');
const lo = document.createElement('canvas'); lo.width = W / PX; lo.height = H / PX;
const g = lo.getContext('2d');
const mini = document.createElement('canvas'); mini.width = 80; mini.height = 70;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeBack = u => { const k = 1.4; return 1 + (k + 1) * Math.pow(u - 1, 3) + k * Math.pow(u - 1, 2); };

/* ---------- 演出の時刻(秒) ---------- */
const T = {
  lowerBowl: 2.2, gassho: 2.95, lookDown: 4.7, spark: 5.45, chop: 5.7,
  slideIn: 6.0, slideEnd: 6.95, botRamen: 7.25, twoUp: 20.6, twoEnd: 21.45, botColor: 21.5,
  outro: 26.8, outroEnd: 27.5, drink: 27.45, title: 27.7,
};

/* ---------- 実際のゲームをコマ送りで動かす ---------- */
const GW = 1400, GH = 1080;
async function makeGame(mode, tension, seed) {
  const blank = () => ({ best: 0, score: 0, level: 1, maxLevel: 1, checkpoints: { 1: 0 }, played: true });
  localStorage.clear();
  localStorage.setItem('oilmerge.save.v1', JSON.stringify({ mode, lang: 'en', tension, tensionMode: 'fixed', drips: true, hashiShift: false, charges: 0, modes: { color: blank(), ramen: blank() } }));
  const src = await (await fetch('../index.html')).text();
  const prelude = `<script>(function(){
    var s=${seed};Math.random=function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
    window.AudioContext=undefined;window.webkitAudioContext=undefined;
    var now=0;performance.now=function(){return now};
    window.requestAnimationFrame=function(cb){window.__raf=cb;return 1};
    window.__tick=function(ms){now+=ms;var f=window.__raf;window.__raf=null;if(f)f(now)};
  })();<\/script>`;
  const fr = document.createElement('iframe');
  fr.style.cssText = `position:fixed;left:-${GW + 50}px;top:0;width:${GW}px;height:${GH}px;border:0`;
  await new Promise(r => { fr.onload = r; fr.srcdoc = src.replace('<head>', '<head>' + prelude); document.body.appendChild(fr); });
  const w = fr.contentWindow, o = w.__oilmerge;
  // 動画では見やすさのため、油を大きめ・少なめにする
  const cfg0 = o.Game.config.bind(o.Game);
  o.Game.config = L => {
    const k = cfg0(L);
    if (mode === 'ramen' && !k.bonus) { k.fill = L === 1 ? .46 : .4; k.drops = L === 1 ? 5 : 8; }
    return k;
  };
  return { w, o, G: o.Game, canvas: fr.contentDocument.getElementById('gl'), tip: { x: GW / 2, y: GH / 2, down: false, show: false }, on: false, lastMerge: 0, lastVanish: 0, lastLevel: 0, maru: false };
}
function tickGame(gm) {
  // 物理は60Hz分進め、描画は撮影するコマだけにする
  const keep = gm.w.render;
  gm.w.render = () => {};
  gm.w.__tick(1000 / 60);
  gm.w.render = keep;
  gm.w.__tick(1000 / 60);
}
function ptrEv(gm, type) {
  gm.canvas.dispatchEvent(new gm.w.PointerEvent(type, { pointerId: 7, clientX: gm.tip.x, clientY: gm.tip.y, bubbles: true, isPrimary: true, pointerType: 'touch' }));
}

/* 指(箸)の操作: 小さい塊を大きい塊へ運ぶ */
function botStep(gm, t, dragT, restT) {
  const b = gm.bot || (gm.bot = { ph: 'pick', at: 0 });
  const G = gm.G, o = gm.o, tip = gm.tip;
  const follow = () => { const d = o.blobList.find(k => k.id === b.id); if (d) b.to = o.toCss(d.sx / d.n, d.sy / d.n); };
  if (G.state !== 'play') { if (tip.down) { ptrEv(gm, 'pointerup'); tip.down = false; } b.ph = 'pick'; tip.drag = false; return; }
  if (b.ph === 'pick') {
    const list = o.blobList.slice();
    let pick = null;
    for (const col of G.colorsLeft) {
      const L = list.filter(k => k.col === col).sort((a, c2) => a.n - c2.n);
      if (L.length > 1) { pick = L; break; }
    }
    if (!pick) return;
    const s = pick[0], d = pick[pick.length - 1];
    b.from = o.toCss(s.sx / s.n, s.sy / s.n);
    b.id = d.id; b.to = o.toCss(d.sx / d.n, d.sy / d.n);
    b.sx = tip.x; b.sy = tip.y; b.ph = 'reach'; b.at = t;
    tip.show = true;
  } else if (b.ph === 'reach') {
    const u = easeIO(ramp(t, b.at, b.at + .32));
    tip.x = lerp(b.sx, b.from[0], u); tip.y = lerp(b.sy, b.from[1], u);
    if (u >= 1) { ptrEv(gm, 'pointerdown'); tip.down = true; b.ph = 'drag'; b.at = t; b.m0 = o.save.merges; gm.onDown && gm.onDown(t); }
  } else if (b.ph === 'drag') {
    const u = easeIO(ramp(t, b.at, b.at + dragT));
    follow();
    tip.x = lerp(b.from[0], b.to[0], u); tip.y = lerp(b.from[1], b.to[1], u);
    tip.drag = true;
    ptrEv(gm, 'pointermove');
    if (u >= 1) { b.ph = 'hold'; b.at = t; }
  } else if (b.ph === 'hold') {
    follow();
    tip.x = lerp(tip.x, b.to[0], .2); tip.y = lerp(tip.y, b.to[1], .2);
    ptrEv(gm, 'pointermove');
    // くっつくまで離さない
    if (t - b.at > 2 || (t - b.at > .1 && o.save.merges > b.m0)) { ptrEv(gm, 'pointerup'); tip.down = false; tip.drag = false; b.ph = 'rest'; b.at = t; }
  } else if (t - b.at > restT) b.ph = 'pick';
}

/* ---------- ドット絵の部品 ---------- */
const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function ell(x, y, rx, ry, col) {
  g.fillStyle = col;
  x = Math.round(x); y = Math.round(y);
  for (let j = -ry; j <= ry; j++) {
    const k = Math.round(rx * Math.sqrt(Math.max(0, 1 - (j * j) / ((ry + .35) * (ry + .35)))));
    g.fillRect(x - k, y + j, k * 2 + 1, 1);
  }
}
const disc = (x, y, r, col) => ell(x, y, r, r, col);
function pxLine(x0, y0, x1, y1, col, w = 1) {
  g.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) g.fillRect(Math.round(lerp(x0, x1, i / n) - w / 2), Math.round(lerp(y0, y1, i / n) - w / 2), w, w);
}

function drawBackground(t, ox) {
  // 壁
  R(0, 0, 240, 135, '#f2dcb4');
  for (let y = 0; y < 100; y += 6) R(0, y, 240, 1, '#ecd3a6');
  R(0, 78, 240, 22, '#c98f58'); R(0, 78, 240, 1, '#a9713f');
  for (let x = (ox % 14 + 14) % 14 - 14; x < 240; x += 14) R(x, 79, 1, 21, '#b67f4b');
  // 窓
  const wx = 18 + ox;
  R(wx - 2, 12, 44, 42, '#8a5a33'); R(wx, 14, 40, 38, '#bfe6f5'); R(wx, 40, 40, 12, '#d8efd0');
  disc(wx + 30, 24, 4, '#fff6c8');
  R(wx + 19, 14, 2, 38, '#8a5a33'); R(wx, 32, 40, 2, '#8a5a33');
  // のれん
  const nx = 92 + ox;
  R(nx - 6, 6, 68, 2, '#6b4426');
  for (let i = 0; i < 4; i++) {
    const sway = Math.round(Math.sin(t * 1.4 + i) * .6);
    R(nx + i * 14.5, 8, 13, 20 + sway, '#37507e');
    R(nx + i * 14.5 + 3, 13, 7, 7, '#f4f1e6'); disc(nx + i * 14.5 + 6, 16, 2, '#c8402f');
  }
  // 提灯
  const lx = 75 + ox;
  R(lx, 4, 1, 5, '#55331c'); ell(lx, 16, 7, 9, '#d3402f'); R(lx - 4, 7, 9, 1, '#2a2019'); R(lx - 4, 25, 9, 1, '#2a2019');
  for (let y = 11; y < 23; y += 3) R(lx - 6, y, 13, 1, '#b5311f');
  // 棚と招き猫(手をふる)
  const sx = 192 + ox;
  R(sx - 4, 44, 44, 3, '#8a5a33');
  const paw = Math.sin(t * 5) > 0 ? 0 : 2;
  ell(sx + 9, 38, 5, 6, '#fbf7ec'); disc(sx + 9, 30, 6, '#fbf7ec');
  R(sx + 4, 24, 2, 2, '#fbf7ec'); R(sx + 12, 24, 2, 2, '#fbf7ec'); R(sx + 5, 25, 1, 1, '#e88b84'); R(sx + 13, 25, 1, 1, '#e88b84');
  R(sx + 6, 29, 1, 1, '#2a2019'); R(sx + 11, 29, 1, 1, '#2a2019'); R(sx + 8, 32, 2, 1, '#2a2019');
  R(sx + 5, 35, 8, 1, '#c8402f'); R(sx + 8, 36, 2, 2, '#e9c24a');
  R(sx + 14, 28 + paw, 3, 6, '#fbf7ec');
  R(sx + 22, 34, 10, 10, '#c98f58'); R(sx + 24, 36, 6, 6, '#f2dcb4'); // 小物
  // 品書き(文字のない札)
  for (let i = 0; i < 3; i++) {
    const mx = 156 + i * 10 + ox;
    R(mx, 12, 8, 24, '#fbf3df'); R(mx, 12, 8, 1, '#b67f4b');
    for (let y = 16; y < 32; y += 4) R(mx + 1, y, 6, 2, i === 1 ? '#c8402f' : '#6a5a4a');
  }
  // カウンター(天板と、手前の板)
  R(0, 100, 240, 20, '#c58a4e'); R(0, 100, 240, 2, '#e0ae74');
  for (let i = -2; i < 8; i++) R(((i * 41 + ox) % 280 + 280) % 280 - 20, 102, 22, 1, '#b67b42');
  R(0, 120, 240, 15, '#8c5529'); R(0, 120, 240, 2, '#6e4120');
  for (let x = (ox % 18 + 18) % 18 - 18; x < 240; x += 18) R(x, 122, 1, 13, '#7a4923');
  // 小物: 水のコップ、しょうゆ差し、箸立て
  const cx = 176 + ox;
  ell(cx + 4, 113, 7, 1, '#a9713f'); R(cx, 99, 9, 14, '#d9eef2'); R(cx, 99, 9, 1, '#fff'); R(cx + 1, 104, 7, 8, '#a9dbe8'); R(cx + 7, 100, 1, 12, '#f2fbfd');
  const by = 200 + ox;
  ell(by + 3, 113, 6, 1, '#a9713f'); R(by, 102, 7, 11, '#3a1f12'); R(by + 2, 97, 3, 5, '#3a1f12'); R(by + 1, 95, 5, 2, '#c8402f'); R(by + 1, 104, 1, 6, '#6a4630');
  const hx = 66 + ox;
  ell(hx + 5, 113, 7, 1, '#a9713f'); R(hx, 98, 10, 15, '#7a3520'); R(hx, 98, 10, 2, '#964a2f');
  for (let i = 0; i < 5; i++) R(hx + 1 + i * 2, 87 + (i % 2) * 2, 1, 11, i % 2 ? '#d9a441' : '#3a1a10');
}

function bowlOnTable(x, y, soup, t, dropsGlint) {
  // 上から少し見たどんぶり
  ell(x + 1, y + 13, 15, 2, '#7d4a24');
  for (let j = 0; j < 12; j++) {
    const k = Math.round(lerp(18, 9, j / 11));
    R(x - k, y + 1 + j, k * 2 + 1, 1, j < 2 ? '#fffdf6' : '#f7efe0');
  }
  R(x - 16, y + 4, 33, 2, '#d3402f');
  for (let i = -15; i < 16; i += 3) R(x + i, y + 4, 1, 2, '#fffdf6');
  ell(x, y, 19, 4, '#fffdf6');
  ell(x, y, 17, 3, soup);
  if (dropsGlint) {
    const gl = Math.sin(t * 7) > .2;
    for (const [ox, oy] of [[-8, -1], [-2, 1], [5, 0], [10, -1], [2, -2]]) { R(x + ox, y + oy, 2, 1, '#ffd65a'); if (gl) R(x + ox, y + oy, 1, 1, '#fff'); }
  }
}
function bowlRaised(x, y, tilt) {
  // 口元へ持ち上げた、どんぶりの底側
  for (let j = 0; j < 15; j++) {
    const k = Math.round(lerp(19, 9, j / 14));
    R(x - k + Math.round(tilt), y + j, k * 2 + 1, 1, '#f7efe0');
  }
  R(x - 18 + Math.round(tilt), y + 3, 37, 3, '#d3402f');
  for (let i = -17; i < 18; i += 3) R(x + i + Math.round(tilt), y + 4, 1, 1, '#fffdf6');
  R(x - 19 + Math.round(tilt), y, 39, 2, '#fffdf6');
  R(x - 8 + Math.round(tilt), y + 14, 17, 2, '#e5dac6');
}
function steam(x, y, t, a) {
  for (let i = 0; i < 3; i++) {
    const u = (t * .35 + i * .33) % 1;
    if (Math.random() > a) continue;
    R(x + (i - 1) * 7 + Math.sin(t * 2 + i) * 2, y - u * 16, 2, 2, 'rgba(255,255,255,.7)');
  }
}

function drawChar(x, p, t) {
  const headY = 62 + (p.bow || 0), tuft = Math.sin(t * 3) > 0 ? 1 : 0;
  // 体
  R(x - 12, 77 + (p.bow || 0) * .5, 25, 23, '#3f5f8f');
  R(x - 10, 75 + (p.bow || 0) * .5, 21, 3, '#3f5f8f');
  R(x - 3, 75 + (p.bow || 0), 7, 3, '#f7d8b4');
  // 頭
  const hx = x + (p.tilt || 0);
  disc(hx, headY, 13, '#f7d8b4');
  ell(hx, headY - 6, 13, 7, '#3a2a24');
  R(hx - 13, headY - 3, 3, 4, '#3a2a24'); R(hx + 11, headY - 3, 3, 4, '#3a2a24');
  R(hx - 7, headY - 3, 5, 2, '#3a2a24'); R(hx + 1, headY - 3, 7, 2, '#3a2a24');
  R(hx - 1, headY - 16 - tuft, 2, 3, '#3a2a24'); R(hx + 1, headY - 18 - tuft, 2, 2, '#3a2a24');
  if (!p.hideFace) {
    const ey = headY + 2 + (p.lookDown ? 1 : 0);
    if (p.eyes === 'closed') {
      R(hx - 7, ey, 4, 1, '#2a2019'); R(hx + 4, ey, 4, 1, '#2a2019');
    } else if (p.eyes === 'happy') {
      R(hx - 7, ey, 1, 1, '#2a2019'); R(hx - 6, ey - 1, 2, 1, '#2a2019'); R(hx - 4, ey, 1, 1, '#2a2019');
      R(hx + 4, ey, 1, 1, '#2a2019'); R(hx + 5, ey - 1, 2, 1, '#2a2019'); R(hx + 7, ey, 1, 1, '#2a2019');
    } else if (p.eyes === 'sly') {
      R(hx - 7, ey - 1, 4, 1, '#2a2019'); R(hx - 6, ey, 2, 1, '#2a2019');
      R(hx + 4, ey - 1, 4, 1, '#2a2019'); R(hx + 5, ey, 2, 1, '#2a2019');
    } else if (p.eyes === 'wide') {
      R(hx - 6, ey - 1, 2, 3, '#2a2019'); R(hx + 5, ey - 1, 2, 3, '#2a2019');
      R(hx - 6, ey - 1, 1, 1, '#fff'); R(hx + 5, ey - 1, 1, 1, '#fff');
    } else {
      R(hx - 6, ey, 2, 2, '#2a2019'); R(hx + 5, ey, 2, 2, '#2a2019');
    }
    R(hx - 10, headY + 5, 3, 2, '#f3a896'); R(hx + 8, headY + 5, 3, 2, '#f3a896');
    const my = headY + 7;
    if (p.mouth === 'open') { R(hx - 1, my, 3, 2, '#b4483c'); }
    else if (p.mouth === 'smile') { R(hx - 2, my, 1, 1, '#7a3b2e'); R(hx - 1, my + 1, 3, 1, '#7a3b2e'); R(hx + 2, my, 1, 1, '#7a3b2e'); }
    else if (p.mouth === 'sly') { R(hx - 2, my + 1, 4, 1, '#7a3b2e'); R(hx + 2, my, 1, 1, '#7a3b2e'); }
    else R(hx - 1, my, 3, 1, '#7a3b2e');
  }
}
function arms(x, lh, rh) {
  // 肩から手へ
  pxLine(x - 11, 81, lh[0], lh[1], '#35517c', 4); disc(lh[0], lh[1], 2, '#f7d8b4');
  pxLine(x + 12, 81, rh[0], rh[1], '#35517c', 4); disc(rh[0], rh[1], 2, '#f7d8b4');
}
function chopsticks(hx, hy, tx, ty) {
  pxLine(hx + 5, hy - 4, tx, ty, '#6d2f1c', 1);
  pxLine(hx + 7, hy - 3, tx + 2, ty, '#8a3f28', 1);
}

/* キャラの動きを時刻から決める */
function drawPerson(x, t, s) {
  const table = 92;
  const bowlY = table;
  if (t < T.lowerBowl) {
    const bob = Math.sin(t * 4) * .8;
    drawChar(x, { hideFace: true }, t);
    bowlRaised(x, 54 + bob, Math.sin(t * 1.5) * 1);
    arms(x, [x - 17, 66 + bob], [x + 18, 66 + bob]);
    return;
  }
  if (t < T.lowerBowl + .4) {
    const u = easeIO(ramp(t, T.lowerBowl, T.lowerBowl + .4));
    drawChar(x, { eyes: 'closed', mouth: 'open' }, t);
    const y = lerp(54, table + 1, u);
    if (u < .55) { bowlRaised(x, y, 0); } else bowlOnTable(x, lerp(y, table + 7, u), '#d9851e', t);
    arms(x, [x - 19, y + 11], [x + 20, y + 11]);
    return;
  }
  const inDrink = t >= T.drink;
  if (inDrink) {
    const u = easeIO(ramp(t, T.drink, T.drink + .35)), bob = Math.sin(t * 4) * .7 * u;
    drawChar(x, { hideFace: u > .5, eyes: 'closed' }, t);
    if (u < .5) bowlOnTable(x, lerp(table + 7, 60, u * 2), '#d9851e', t);
    else bowlRaised(x, lerp(68, 54, (u - .5) * 2) + bob, Math.sin(t * 1.5));
    const hy = lerp(table + 10, 66, u) + bob;
    arms(x, [x - 19, hy], [x + 20, hy]);
    return;
  }
  const bowl = () => bowlOnTable(x, table + 7, '#d9851e', t, t >= T.lookDown);
  if (t < T.gassho) {
    drawChar(x, { eyes: 'closed', mouth: 'open' }, t);
    bowl();
    arms(x, [x - 21, 102], [x + 22, 102]);
  } else if (t < T.lookDown) {
    const bow = Math.round(Math.sin(ramp(t, T.gassho, T.lookDown) * Math.PI) * 3);
    drawChar(x, { eyes: 'closed', mouth: 'smile', bow }, t);
    bowl();
    arms(x, [x - 2, 84 + bow], [x + 3, 84 + bow]);
    R(x - 1, 78 + bow, 3, 7, '#f7d8b4');
  } else if (t < T.spark) {
    drawChar(x, { eyes: 'open', mouth: 'flat', lookDown: true }, t);
    bowl();
    arms(x, [x - 21, 102], [x + 22, 102]);
  } else if (t < T.chop) {
    drawChar(x, { eyes: 'wide', mouth: 'open', lookDown: true }, t);
    bowl();
    arms(x, [x - 21, 102], [x + 22, 102]);
  } else {
    // 箸でつつく
    const cheer = s.cheer > 0;
    const poke = s.poke;
    if (cheer) {
      const hop = Math.round(Math.abs(Math.sin(s.cheer * 9)) * 2);
      drawChar(x, { eyes: 'happy', mouth: 'open', bow: -hop }, t);
      bowl();
      arms(x, [x - 20, 66 - hop], [x + 21, 66 - hop]);
    } else {
      drawChar(x, { eyes: t < T.slideEnd ? 'sly' : s.active ? 'sly' : 'open', mouth: t < T.slideEnd || s.active ? 'sly' : 'flat', lookDown: true, tilt: s.tilt || 0 }, t);
      bowl();
      const hy = 80 + poke * 5;
      arms(x, [x - 21, 102], [x + 20, hy]);
      chopsticks(x + 20, hy, x + 4 - poke * 2, 95 + poke * 3);
      if (poke > .5) { R(x - 2, 99, 9, 1, '#ffe08a'); }
    }
  }
}

/* ---------- 文字の演出 ---------- */
const sfx = [];     // 擬音 {t,d,text,sub,x,y,rot,size,fill}
function pop(t, d, text, sub, x, y, opt = {}) { sfx.push({ t, d, text, sub, x, y, rot: opt.rot ?? rnd(-.09, .09), size: opt.size ?? 92, fill: opt.fill ?? '#ffcf3f', z: opt.z || 0 }); }
let seedV = 7; const rnd = (a, b) => { seedV = (seedV * 16807) % 2147483647; return a + (seedV / 2147483647) * (b - a); };
function drawSfx(t) {
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const e of sfx) {
    if (t < e.t || t > e.t + e.d) continue;
    const a = t - e.t, inn = easeBack(clamp(a / .16, 0, 1)), fade = 1 - ramp(t, e.t + e.d - .22, e.t + e.d);
    c.save();
    c.translate(e.x, e.y - a * 10);
    c.rotate(e.rot + Math.sin(a * 9) * .012);
    c.scale(inn, inn);
    c.globalAlpha = fade;
    c.font = `${e.size}px Bangers, Impact, sans-serif`;
